name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ios:
    name: iOS build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project frontend/Signu.xcodeproj \
            -scheme Signu

      - name: Build Debug
        run: |
          xcodebuild build \
            -project frontend/Signu.xcodeproj \
            -scheme Signu \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          UDID=$(xcrun simctl list devices available \
            | awk '/^-- iOS/ {ios = 1; next}
                   /^-- / {ios = 0}
                   ios && /iPhone/ {
                     match($0, /[0-9A-F-]{36}/)
                     print substr($0, RSTART, RLENGTH); exit
                   }')
          test -n "$UDID" || { echo "no available iPhone simulator"; exit 1; }
          echo "Testing on $UDID"
          xcodebuild test \
            -project frontend/Signu.xcodeproj \
            -scheme Signu \
            -configuration Debug \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Release
        run: |
          xcodebuild build \
            -project frontend/Signu.xcodeproj \
            -scheme Signu \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

  schema:
    name: Schema applies
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.109.1
      - name: Apply migrations from scratch
        working-directory: backend
        env:
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder-never-used
        run: |
          set -eo pipefail

          supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,mailpit 2>&1 | tee cli.log
          supabase db reset 2>&1 | tee -a cli.log

          if grep -qiE "warn(ing)?:" cli.log; then
            echo "::error::Supabase CLI emitted a warning; a green step here would be dishonest. See the step log."
            grep -iE "warn(ing)?:" cli.log
            exit 1
          fi

      - name: Vocabularies agree across SQL, TypeScript and Swift
        working-directory: backend
        run: |
          set -eo pipefail

          python3 check-vocabularies.py --selftest

          DB_URL=$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '"')
          if [ -z "$DB_URL" ]; then
            echo "::error::could not read DB_URL from supabase status"
            exit 1
          fi

          psql "$DB_URL" -At -F$'\t' <<'SQL' | python3 check-vocabularies.py
          select rel.relname, att.attname, pg_get_constraintdef(con.oid)
          from pg_constraint con
          join pg_class rel on rel.oid = con.conrelid
          join pg_namespace nsp on nsp.oid = rel.relnamespace
          join pg_attribute att
            on att.attrelid = rel.oid and att.attnum = con.conkey[1]
          where con.contype = 'c'
            and nsp.nspname = 'public'
            and array_length(con.conkey, 1) = 1
          order by rel.relname, att.attname;
          SQL

      - name: Database tests
        working-directory: backend
        env:
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder-never-used
        run: supabase test db

  detection:
    name: Detection tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Type-check
        run: |
          deno check --lock=backend/deno.lock \
            backend/supabase/functions/_shared/detection.ts \
            backend/supabase/functions/_shared/reminders.ts \
            backend/supabase/functions/_shared/actions.ts \
            backend/supabase/functions/_shared/auth.ts \
            backend/supabase/functions/_shared/pluggy.ts \
            backend/supabase/functions/_shared/accounts.ts \
            backend/supabase/functions/_shared/sync.ts \
            backend/supabase/functions/run-detection/index.ts \
            backend/supabase/functions/pluggy-sync/index.ts \
            backend/supabase/functions/send-reminders/index.ts \
            backend/supabase/functions/confirm-suggestion/index.ts \
            backend/supabase/functions/cancel-subscription/index.ts \
            backend/supabase/functions/remove-connection/index.ts \
            backend/supabase/functions/delete-account/index.ts \
            backend/supabase/functions/connect-token/index.ts \
            backend/supabase/functions/register-connection/index.ts

      - name: Lint
        run: deno lint backend/supabase/functions

      - name: Test
        run: deno test --lock=backend/deno.lock backend/supabase/functions/_shared/

  deploy:
    name: Deploy to production
    needs: [ios, schema, detection]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    concurrency:
      group: production-deploy
      cancel-in-progress: false

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder-never-used

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.109.1

      - name: Link
        working-directory: backend
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: What would be pushed
        working-directory: backend
        run: supabase db push --linked --dry-run

      - name: Push migrations
        working-directory: backend
        run: supabase db push --linked

      - name: Which functions to deploy
        id: scope
        run: |
          set -eo pipefail
          BEFORE='${{ github.event.before }}'
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "no usable base commit; deploying every function"
            echo "all=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE" '${{ github.sha }}' -- backend/supabase/functions/ || true)
          echo "changed under functions/:"; echo "${CHANGED:-<none>}"

          if echo "$CHANGED" | grep -q 'backend/supabase/functions/_shared/'; then
            echo "_shared changed; every function bundles it, so deploying all"
            echo "all=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SLUGS=$(echo "$CHANGED" \
            | sed -n 's#^backend/supabase/functions/\([^/]*\)/.*#\1#p' \
            | grep -v '^_shared$' | sort -u | tr '\n' ' ' || true)
          echo "all=false" >> "$GITHUB_OUTPUT"
          echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"

      - name: Note deploy start
        id: t0
        run: echo "ms=$(python3 -c 'import time; print(int(time.time() * 1000))')" >> "$GITHUB_OUTPUT"

      - name: Deploy functions
        working-directory: backend
        run: |
          set -eo pipefail
          if [ '${{ steps.scope.outputs.all }}' = 'true' ]; then
            supabase functions deploy
          elif [ -n '${{ steps.scope.outputs.slugs }}' ]; then
            for slug in ${{ steps.scope.outputs.slugs }}; do
              echo "::group::deploy $slug"
              supabase functions deploy "$slug"
              echo "::endgroup::"
            done
          else
            echo "no function changed; nothing to deploy"
          fi

      - name: Verify functions shipped
        working-directory: backend
        run: |
          set -eo pipefail
          supabase functions list --output-format json > /tmp/functions.json
          python3 - '${{ steps.t0.outputs.ms }}' '${{ steps.scope.outputs.slugs }}' <<'PY'
          import json, os, re, sys

          started = int(sys.argv[1])
          changed = sys.argv[2].split()

          payload = json.load(open('/tmp/functions.json'))
          rows = payload['functions'] if isinstance(payload, dict) else payload
          remote = {f['slug']: f for f in rows}

          root = 'supabase/functions'
          local = sorted(d for d in os.listdir(root)
                         if not d.startswith('_') and os.path.isdir(os.path.join(root, d)))

          declared = {}
          for slug, body in re.findall(r'\[functions\.([^\]]+)\]([^\[]*)', open('supabase/config.toml').read()):
              m = re.search(r'verify_jwt\s*=\s*(true|false)', body)
              declared[slug] = (m.group(1) == 'true') if m else True

          problems = []
          for slug in local:
              f = remote.get(slug)
              if f is None:
                  problems.append(slug + ': in the repo but NOT deployed')
                  continue
              want = declared.get(slug, True)
              print('%-22s v%-4s verify_jwt=%-5s updated_at=%s'
                    % (slug, f['version'], f['verify_jwt'], f['updated_at']))
              if f['status'] != 'ACTIVE':
                  problems.append('%s: status %s, expected ACTIVE' % (slug, f['status']))
              if f['verify_jwt'] != want:
                  problems.append('%s: verify_jwt is %s remotely but config.toml declares %s'
                                  % (slug, f['verify_jwt'], want))

          for slug in changed:
              f = remote.get(slug)
              if f is not None and f['updated_at'] < started:
                  problems.append('%s: its sources changed in this push, but the deployed bundle '
                                  'predates this deploy' % slug)

          for slug in sorted(set(remote) - set(local)):
              print('note: %s is deployed but has no directory in this repo' % slug)

          if problems:
              print('')
              print('FUNCTION VERIFICATION FAILED')
              for p in problems:
                  print('  ' + p)
              sys.exit(1)
          print('')
          print('%d functions present, ACTIVE, and matching their declared verify_jwt' % len(local))
          PY

      - name: Verify every migration is applied remotely
        working-directory: backend
        run: |
          set -eo pipefail
          supabase migration list --linked --output-format json | tee /tmp/migrations.json
          python3 - <<'PY'
          import json, sys
          rows = json.load(open('/tmp/migrations.json'))['migrations']
          pending = [m['local'] for m in rows if not m.get('remote')]
          if pending:
              print(f"::error::migrations still not applied remotely: {', '.join(pending)}")
              sys.exit(1)
          print(f"all {len(rows)} migrations present remotely")
          PY
