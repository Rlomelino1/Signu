name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Explicit, ahead of the builds. `xcodebuild build` resolves packages
      # implicitly, but then a resolution failure surfaces buried in compiler
      # output; as its own step it fails legibly. This is the project's first
      # external dependency, so the failure mode is new: Package.resolved pins
      # exact versions and is committed, so this step is a fetch, not a solve.
      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project frontend/Signu.xcodeproj \
            -scheme Signu

      - name: Build Debug
        run: |
          xcodebuild build \
            -project frontend/Signu.xcodeproj \
            -scheme Signu \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      # The tests exist now, so CI runs them. Until this step there was no Swift
      # test target at all -- the same shape as the gap v27 closed for the Deno
      # tests, where 32 tests encoding historical bugs sat in a file nothing
      # executed on a PR.
      #
      # A simulator destination, not `generic/platform=iOS`: a unit-test bundle is
      # loaded by a host app, and the generic destination cannot run one.
      #
      # The device is resolved at runtime rather than named. A literal
      # 'name=iPhone 17 Pro' is really an assertion about which Xcode the runner
      # image ships, and it fails as an unhelpful "Unable to find a destination"
      # the week that image rolls forward. `-destination id=<udid>` asks the
      # installed Xcode what it actually has.
      - name: Test
        run: |
          UDID=$(xcrun simctl list devices available \
            | awk '/^-- iOS/ {ios = 1; next}
                   /^-- / {ios = 0}
                   ios && /iPhone/ {
                     match($0, /[0-9A-F-]{36}/)
                     print substr($0, RSTART, RLENGTH); exit
                   }')
          test -n "$UDID" || { echo "no available iPhone simulator"; exit 1; }
          echo "Testing on $UDID"
          xcodebuild test \
            -project frontend/Signu.xcodeproj \
            -scheme Signu \
            -configuration Debug \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Release
        run: |
          xcodebuild build \
            -project frontend/Signu.xcodeproj \
            -scheme Signu \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

  schema:
    name: Schema applies
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Apply migrations from scratch
        working-directory: backend
        env:
          # config.toml references this for the Google provider, and an unset
          # env() reference makes the CLI emit
          #   WARN: environment variable is unset: …
          # which the gate below correctly treats as a failure. A placeholder is
          # the honest fix rather than exempting the warning: this job starts a
          # LOCAL stack and never performs an OAuth exchange, so the CLI needs a
          # value to interpolate and nothing more. Weakening the gate would have
          # hidden the next genuinely-unset secret.
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder-never-used
        run: |
          # pipefail is NOT set by the default `bash -e {0}` shell, and both
          # commands below are piped into tee. Without it, a failing supabase
          # command would exit 0 through tee and this step would pass while
          # doing nothing.
          set -eo pipefail

          # Container names, NOT the service names in `supabase start --help`.
          # The help text lists storage/analytics; the runtime rejects both and
          # accepts storage-api/logflare. An invalid name is only a WARNING, so a
          # wrong list silently stops excluding and the job still goes green.
          #
          # `mailpit` is a second instance of the same trap, and the help text is
          # wrong in a new way: it lists `inbucket`, the runtime REJECTS that, and
          # the container is still named supabase_inbucket_backend. Only `mailpit`
          # is accepted. Verified by running both -- `inbucket` warns and leaves
          # the container up; `mailpit` is silent and port 54324 goes unbound.
          #
          # It is excluded because it caused a real red build: `db reset` restarts
          # containers, mailpit raced itself for 54324, and the run died AFTER all
          # six migrations had applied but BEFORE the gate below could run. A
          # migrations job has no use for a mail catcher, so this removes a
          # container and a port from the equation rather than papering over a
          # flake with a retry.
          supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,mailpit 2>&1 | tee cli.log
          supabase db reset 2>&1 | tee -a cli.log

          # Warning gate. The CLI reports some real problems as warnings, not
          # errors, so a passing step can be doing less than it claims: an
          # invalid `-x` name sat in a green log for a full run before anyone
          # read it. This makes that reading automatic. Scoped to the CLI's own
          # output on purpose -- runner-level annotations (e.g. the Node 20
          # deprecation notice on the actions themselves) are emitted outside
          # this stream and cannot false-positive it.
          if grep -qiE "warn(ing)?:" cli.log; then
            echo "::error::Supabase CLI emitted a warning; a green step here would be dishonest. See the step log."
            grep -iE "warn(ing)?:" cli.log
            exit 1
          fi

      # pgTAP, against the stack the step above just built. Until v61 this job
      # proved only that migrations APPLY -- nothing asserted what the SQL DOES,
      # and `apply_detection` is the most consequential function in the product:
      # it is the only writer of detection's results and it holds v24's frozen
      # region. Its first test file immediately found a latent
      # `23505 duplicate key` that could abort an entire sync on a re-parented
      # charge, which is the argument for this step in one sentence.
      #
      # A SEPARATE step on purpose, and its output is NOT teed into cli.log: the
      # warning gate greps that file, and pgTAP failure diagnostics are free text
      # that can contain the word "warning". Keeping them apart leaves the gate
      # scoped to the CLI's own output, and a failing test still fails the job on
      # its exit code.
      #
      # `supabase test db` needs no file list -- it runs everything in
      # supabase/tests -- so a new suite is picked up with no edit here, unlike
      # the `deno check` below.
      - name: Database tests
        working-directory: backend
        env:
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder-never-used
        run: supabase test db

  detection:
    name: Detection tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # NO permission flags. The drafted version of this job passed
      # `--allow-none`, which is NOT a valid Deno flag -- 2.9.5 rejects it with
      # "tip: to pass '--allow-none' as a value, use '-- --allow-none'" and the
      # job would have failed on its first run. Verified against a real Deno
      # before committing, on a cold cache to match this runner: the tests are
      # pure functions needing no permissions, and Deno 2 already allows imports
      # from deno.land and esm.sh by default, so no flag is required at all.
      - name: Type-check
        run: |
          deno check \
            backend/supabase/functions/_shared/detection.ts \
            backend/supabase/functions/_shared/reminders.ts \
            backend/supabase/functions/_shared/actions.ts \
            backend/supabase/functions/_shared/auth.ts \
            backend/supabase/functions/_shared/pluggy.ts \
            backend/supabase/functions/_shared/accounts.ts \
            backend/supabase/functions/run-detection/index.ts \
            backend/supabase/functions/pluggy-sync/index.ts \
            backend/supabase/functions/send-reminders/index.ts \
            backend/supabase/functions/confirm-suggestion/index.ts \
            backend/supabase/functions/cancel-subscription/index.ts \
            backend/supabase/functions/remove-connection/index.ts \
            backend/supabase/functions/delete-account/index.ts \
            backend/supabase/functions/connect-token/index.ts \
            backend/supabase/functions/register-connection/index.ts

      - name: Lint
        run: deno lint backend/supabase/functions

      # Seventy-five tests: thirty-two encoding every historical bug in
      # detection, seventeen pinning the reminder rules (v28), twenty-six on the
      # user-asserted writes (v30). `deno test _shared/` picks up a new suite in
      # that directory with no edit here, unlike `deno check` above, which names
      # files and does need one.
      #
      # The detection thirty-two encode: the v23 epsilon
      # regression, the presence-based fee filter, the card-payment R3, the
      # dedupe ordinal, the v25 cross-currency pairs. Before this job they lived
      # in a file nothing executed on a PR -- the same shape as the correctness
      # gap v18 closed for the schema.
      - name: Test
        run: deno test backend/supabase/functions/_shared/
