name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build Debug
        run: |
          xcodebuild build \
            -project frontend/Signu.xcodeproj \
            -scheme Signu \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
      - name: Build Release
        run: |
          xcodebuild build \
            -project frontend/Signu.xcodeproj \
            -scheme Signu \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

  schema:
    name: Schema applies
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Apply migrations from scratch
        working-directory: backend
        run: |
          supabase start -x realtime,storage,imgproxy,studio,edge-runtime,analytics,vector
          supabase db reset
